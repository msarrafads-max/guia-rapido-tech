<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">Análise de Produto - Guia Rápido Tech</title>
    
    <!-- Meta tags SEO dinâmicas -->
    <meta id="meta-desc" name="description" content="Análise técnica detalhada.">
    <meta id="meta-keywords" name="keywords" content="tecnologia, review, smartphone, tablet, notebook">

    <!-- Tailwind CSS / Estilos do site -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Biblioteca Marked.js para renderizar Markdown (Negrito, Listas, etc.) -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">

    <main class="max-w-4xl mx-auto px-4 py-10">
        <!-- Cabeçalho do Produto -->
        <div class="mb-8">
            <span id="prod-badge" class="px-3 py-1 text-xs font-bold rounded bg-indigo-600 text-white">ANÁLISE</span>
            <h1 id="prod-title" class="text-3xl md:text-4xl font-extrabold mt-3 mb-2">Carregando produto...</h1>
            <p id="prod-marca" class="text-slate-400 text-sm uppercase tracking-wider"></p>
        </div>

        <!-- Imagem Principal -->
        <div id="container-img" class="mb-8 hidden">
            <img id="prod-img" src="" alt="Produto" class="w-full max-h-[400px] object-cover rounded-xl border border-slate-800">
        </div>

        <!-- Ficha Técnica Dinâmica -->
        <div class="bg-slate-900 border border-slate-800 rounded-xl p-6 mb-8">
            <h3 class="text-lg font-bold mb-4 text-indigo-400">Ficha Técnica Principal</h3>
            <div id="specs-grid" class="grid grid-cols-1 md:grid-cols-2 gap-4 text-sm">
                <!-- Preenchido via JS -->
            </div>
        </div>

        <!-- Caixa de Afiliados / Ofertas -->
        <div class="bg-gradient-to-r from-slate-900 to-indigo-950 border border-indigo-900/50 rounded-xl p-6 mb-8">
            <h3 class="text-lg font-bold mb-4">Melhores Ofertas Encontradas</h3>
            <div id="ofertas-grid" class="flex flex-wrap gap-4">
                <!-- Links inseridos via JS -->
            </div>
        </div>

        <!-- Corpo da Análise (Markdown Renderizado com Negrito e formatações) -->
        <article id="prod-body" class="prose prose-invert max-w-none text-slate-300 leading-relaxed space-y-4">
            Carregando conteúdo da análise...
        </article>
    </main>

    <script>
        // Função para ler os parâmetros da URL (ex: ?cat=smartphones&slug=moto-g06)
        const params = new URLSearchParams(window.location.search);
        const categoria = params.get('cat') || 'smartphones';
        const slug = params.get('slug');

        async function carregarArtigo() {
            if (!slug) {
                document.getElementById('prod-title').innerText = "Produto não especificado.";
                return;
            }

            try {
                // Busca o arquivo Markdown gerado pelo Decap CMS
                const resposta = await fetch(`/${categoria}/${slug}.md`);
                if (!resposta.ok) throw new Error("Artigo não encontrado");
                
                const textoMarkdown = await resposta.text();
                
                // Processa o Frontmatter (cabeçalho YAML do Markdown) e o Corpo
                separarDadosEBody(textoMarkdown);

            } catch (erro) {
                console.error(erro);
                document.getElementById('prod-title').innerText = "Artigo não encontrado ou em construção.";
                document.getElementById('prod-body').innerText = "";
            }
        }

        function separarDadosEBody(conteudoMd) {
            // Extrai o bloco de frontmatter entre '---'
            const partes = conteudoMd.split('---');
            if (partes.length < 3) return;

            const frontmatterRaw = partes[1];
            const markdownBody = partes.slice(2).join('---');

            // Converte o YAML básico em objeto JS
            const dados = {};
            frontmatterRaw.split('\n').forEach(linha => {
                const [chave, ...valorArr] = linha.split(':');
                if (chave && valorArr.length > 0) {
                    let val = valorArr.join(':').trim().replace(/^["'](.*)["']$/, '$1');
                    dados[chave.trim()] = val;
                }
            });

            // Preenche os elementos da página
            document.getElementById('page-title').innerText = dados.title ? `${dados.title} - Guia Rápido Tech` : document.getElementById('page-title').innerText;
            document.getElementById('prod-title').innerText = dados.title || "Análise Técnica";
            document.getElementById('prod-marca').innerText = dados.marca ? `Marca: ${dados.marca}` : "";
            
            if (dados.badge) {
                document.getElementById('prod-badge').innerText = dados.badge;
            }

            if (dados.image) {
                const imgEl = document.getElementById('prod-img');
                imgEl.src = dados.image;
                document.getElementById('container-img').classList.remove('hidden');
            }

            // Renderiza o Markdown do corpo com suporte a **negrito** e formatações
            document.getElementById('prod-body').innerHTML = marked.parse(markdownBody);
        }

        carregarArtigo();
    </script>
</body>
</html>
