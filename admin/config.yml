backend:
  name: github
  repo: msarrafads-max/guia-rapido-tech
  branch: main
  base_url: https://decap-oauth.msarraf-ads.workers.dev
  auth_endpoint: auth

site_url: https://guiarapidotech.com.br
display_url: https://guiarapidotech.com.br
media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "site"
    label: "⚙️ Configurações do site"
    files:
      - name: "global"
        label: "Identidade e SEO global"
        file: "config/site.json"
        format: "json"
        fields:
          - { label: "Nome do site", name: "logoTexto", widget: "string", default: "Guia Rápido Tech" }
          - { label: "Imagem da logo", name: "logoImagem", widget: "image", required: false }
          - { label: "Descrição padrão", name: "seoDescription", widget: "text", required: false }
      - name: "smartphones_hub"
        label: "Vitrine de smartphones"
        file: "smartphones/hub_config.json"
        format: "json"
        fields:
          - { label: "Título da vitrine principal", name: "titulo", widget: "string", default: "Melhores smartphones de dezembro de 2026" }
          - { label: "Subtítulo", name: "subtitulo", widget: "text", required: false }
          - { label: "Selo", name: "badge", widget: "string", required: false }
          - label: "Card grande / slide principal"
            name: "cardPrincipal"
            widget: "object"
            fields:
              - { label: "Título", name: "titulo", widget: "string" }
              - { label: "Descrição", name: "descricao", widget: "text", required: false }
              - { label: "Imagem", name: "imagem", widget: "image", required: false }
              - { label: "Texto do botão", name: "botao", widget: "string", default: "Ler análise" }
              - { label: "Link do artigo", name: "url", widget: "string", hint: "Ex.: /produtos/template.html?cat=smartphones&slug=slug-do-artigo" }
          - label: "Card inferior esquerdo / slides"
            name: "cardInferiorEsquerdo"
            widget: "object"
            fields:
              - { label: "Título do card", name: "titulo", widget: "string" }
              - { label: "Subtítulo", name: "subtitulo", widget: "string", required: false }
              - label: "Artigos do slide"
                name: "artigos"
                widget: "list"
                fields:
                  - { label: "Título", name: "titulo", widget: "string" }
                  - { label: "Texto curto", name: "descricao", widget: "string", required: false }
                  - { label: "Preço exibido", name: "preco", widget: "string", required: false }
                  - { label: "Imagem", name: "imagem", widget: "image", required: false }
                  - { label: "Link do review", name: "url", widget: "string" }
          - label: "Card inferior direito / slides"
            name: "cardInferiorDireito"
            widget: "object"
            fields:
              - { label: "Título do card", name: "titulo", widget: "string" }
              - { label: "Subtítulo", name: "subtitulo", widget: "string", required: false }
              - label: "Artigos do slide"
                name: "artigos"
                widget: "list"
                fields:
                  - { label: "Título", name: "titulo", widget: "string" }
                  - { label: "Texto curto", name: "descricao", widget: "string", required: false }
                  - { label: "Preço exibido", name: "preco", widget: "string", required: false }
                  - { label: "Imagem", name: "imagem", widget: "image", required: false }
                  - { label: "Link do review", name: "url", widget: "string" }
          - { label: "Marcas visíveis no catálogo (uma por linha)", name: "marcas", widget: "list", field: { label: "Marca", name: "marca", widget: "string" } }
      - name: "tablets_hub"
        label: "Vitrine de tablets"
        file: "tablets/hub_config.json"
        format: "json"
        fields:
          - { label: "Título da vitrine", name: "titulo", widget: "string", default: "Melhores tablets" }
          - { label: "Subtítulo", name: "subtitulo", widget: "text", required: false }
          - { label: "Marcas visíveis no catálogo", name: "marcas", widget: "list", field: { label: "Marca", name: "marca", widget: "string" } }
      - name: "notebooks_hub"
        label: "Vitrine de notebooks"
        file: "notebooks/hub_config.json"
        format: "json"
        fields:
          - { label: "Título da vitrine", name: "titulo", widget: "string", default: "Melhores notebooks" }
          - { label: "Subtítulo", name: "subtitulo", widget: "text", required: false }
          - { label: "Marcas visíveis no catálogo", name: "marcas", widget: "list", field: { label: "Marca", name: "marca", widget: "string" } }

  - name: "smartphones"
    label: "📱 Reviews de smartphones"
    folder: "smartphones"
    create: true
    delete: true
    extension: "md"
    format: "frontmatter"
    slug: "{{slug}}"
    summary: "{{title}} — {{marca}}"
    fields: &article_fields
      - { label: "Título do artigo (H1)", name: "title", widget: "string" }
      - { label: "Marca", name: "marca", widget: "string" }
      - { label: "Modelo", name: "modelo", widget: "string" }
      - { label: "Publicado?", name: "published", widget: "boolean", default: true }
      - { label: "Data de publicação", name: "date", widget: "datetime" }
      - { label: "Resumo para cards", name: "description", widget: "text" }
      - { label: "Selo", name: "badge", widget: "string", default: "ANÁLISE COMPLETA", required: false }
      - { label: "Imagem principal", name: "image", widget: "image", required: false }
      - { label: "Texto alternativo da imagem", name: "image_alt", widget: "string", required: false }
      - { label: "Título SEO", name: "seo_title", widget: "string", hint: "Idealmente até 60 caracteres" }
      - { label: "Meta descrição SEO", name: "seo_description", widget: "text", hint: "Resumo para resultados de busca; tente ficar entre 140 e 160 caracteres" }
      - { label: "Slug/URL canônica", name: "canonical_slug", widget: "string", required: false }
      - { label: "Palavra-chave principal", name: "focus_keyword", widget: "string", required: false }
      - { label: "Palavras-chave secundárias", name: "keywords", widget: "list", required: false, field: { label: "Palavra-chave", name: "keyword", widget: "string" } }
      - { label: "Preço de referência", name: "preco_estimado", widget: "string", required: false }
      - { label: "Tela", name: "tela", widget: "string", required: false }
      - { label: "Processador", name: "processador", widget: "string", required: false }
      - { label: "Memória RAM", name: "ram", widget: "string", required: false }
      - { label: "Armazenamento", name: "armazenamento", widget: "string", required: false }
      - { label: "Bateria", name: "bateria", widget: "string", required: false }
      - { label: "Sistema operacional", name: "sistema", widget: "string", required: false }
      - label: "Comparativos"
        name: "comparativos"
        widget: "list"
        required: false
        fields:
          - { label: "Nome do produto comparado", name: "nome", widget: "string" }
          - { label: "Link para review interno", name: "url", widget: "string", required: false }
          - { label: "Ponto forte", name: "ponto_forte", widget: "string", required: false }
          - { label: "Preço de referência", name: "preco", widget: "string", required: false }
      - label: "Amazon"
        name: "amazon"
        widget: "object"
        fields:
          - { label: "Disponibilidade", name: "status", widget: "select", options: ["disponivel", "indisponivel", "consultar"], default: "consultar" }
          - { label: "Preço", name: "preco", widget: "string", required: false }
          - { label: "Link de afiliado", name: "url", widget: "string", required: false }
      - label: "Mercado Livre"
        name: "mercadolivre"
        widget: "object"
        fields:
          - { label: "Disponibilidade", name: "status", widget: "select", options: ["disponivel", "indisponivel", "consultar"], default: "consultar" }
          - { label: "Preço", name: "preco", widget: "string", required: false }
          - { label: "Link de afiliado", name: "url", widget: "string", required: false }
      - label: "Shopee"
        name: "shopee"
        widget: "object"
        fields:
          - { label: "Disponibilidade", name: "status", widget: "select", options: ["disponivel", "indisponivel", "consultar"], default: "consultar" }
          - { label: "Preço", name: "preco", widget: "string", required: false }
          - { label: "Link de afiliado", name: "url", widget: "string", required: false }
      - { label: "Conteúdo completo do review", name: "body", widget: "markdown" }

  - name: "tablets"
    label: "📟 Reviews de tablets"
    folder: "tablets"
    create: true
    delete: true
    extension: "md"
    format: "frontmatter"
    slug: "{{slug}}"
    summary: "{{title}} — {{marca}}"
    fields: *article_fields

  - name: "notebooks"
    label: "💻 Reviews de notebooks"
    folder: "notebooks"
    create: true
    delete: true
    extension: "md"
    format: "frontmatter"
    slug: "{{slug}}"
    summary: "{{title}} — {{marca}}"
    fields: *article_fields
