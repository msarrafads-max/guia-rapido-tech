backend:
  name: github
  repo: msarrafads-max/guia-rapido-tech
  branch: main

media_folder: "images"
public_folder: "/images"

collections:
  # -------------------------------------------------------------
  # PÁGINAS DO SITE (HUB DE DESTAQUES E SLIDES)
  # -------------------------------------------------------------
  - name: "hubs"
    label: "Configurar Páginas (Hubs)"
    files:
      - name: "smartphones_hub"
        label: "Página de Smartphones (Slides)"
        file: "smartphones/hub_config.json"
        fields:
          - label: "Slide 1: Melhores Câmeras"
            name: "cameraProducts"
            widget: "list"
            fields:
              - { label: "Nome do Modelo", name: "nome", widget: "string" }
              - { label: "Especificação / Destaque", name: "spec", widget: "string" }
              - { label: "Preço", name: "preco", widget: "string" }
              - { label: "URL da Análise", name: "url", widget: "string" }
              - { label: "Imagem de Fundo/Watermark", name: "img", widget: "image" }

          - label: "Slide 2: Card Editável (ex: Jogos)"
            name: "destaqueCard2"
            widget: "object"
            fields:
              - { label: "Título do Card", name: "titulo", widget: "string", default: "Mais Potentes para Jogos" }
              - { label: "Selo / Badge", name: "selo", widget: "string", default: "Top 5" }
              - { label: "Ícone FontAwesome", name: "icone", widget: "string", default: "fa-bolt" }
              - label: "Lista de Produtos do Slide 2"
                name: "bateriaProducts"
                widget: "list"
                fields:
                  - { label: "Nome do Modelo", name: "nome", widget: "string" }
                  - { label: "Especificação / Destaque", name: "spec", widget: "string" }
                  - { label: "Preço", name: "preco", widget: "string" }
                  - { label: "URL da Análise", name: "url", widget: "string" }
                  - { label: "Imagem de Fundo/Watermark", name: "img", widget: "image" }

      - name: "tablets_hub"
        label: "Página de Tablets (Banner)"
        file: "tablets/hub_config.json"
        fields:
          - { label: "Título do Banner", name: "bannerTitulo", widget: "string", default: "Melhores com Suporte a Caneta" }
          - { label: "Subtítulo do Banner", name: "bannerSub", widget: "string" }

      - name: "notebooks_hub"
        label: "Página de Notebooks (Banner)"
        file: "notebooks/hub_config.json"
        fields:
          - { label: "Título do Banner", name: "bannerTitulo", widget: "string", default: "Melhores para Trabalho e Estudos" }
          - { label: "Subtítulo do Banner", name: "bannerSub", widget: "string" }

  # -------------------------------------------------------------
  # ARTIGOS E ANÁLISES INDIVIDUAIS
  # -------------------------------------------------------------
  - name: "smartphones"
    label: "Artigos: Smartphones"
    folder: "smartphones"
    create: true
    slug: "{{slug}}"
    filter: { field: "title", pattern: "*" } # Evita conflito com o arquivo hub_config.json
    fields:
      - { label: "Título do Produto (H1)", name: "title", widget: "string" }
      - { label: "Marca", name: "marca", widget: "string" }
      - { label: "Selo / Badge", name: "badge", widget: "string", default: "ANÁLISE" }
      - { label: "Imagem do Produto", name: "image", widget: "image", required: false }
      - { label: "Tela", name: "tela", widget: "string", required: false }
      - { label: "Processador", name: "processador", widget: "string", required: false }
      - { label: "Bateria", name: "bateria", widget: "string", required: false }
      - label: "Ofertas e Afiliados"
        name: "ofertas"
        widget: "object"
        fields:
          - label: "Amazon"
            name: "amazon"
            widget: "object"
            fields:
              - { label: "Preço", name: "preco", widget: "string", required: false }
              - { label: "Link de Afiliado", name: "url", widget: "string", required: false }
          - label: "Mercado Livre"
            name: "mercadoLivre"
            widget: "object"
            fields:
              - { label: "Preço", name: "preco", widget: "string", required: false }
              - { label: "Link de Afiliado", name: "url", widget: "string", required: false }
      - { label: "Texto da Análise", name: "body", widget: "markdown" }

  - name: "tablets"
    label: "Artigos: Tablets"
    folder: "tablets"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Título do Produto (H1)", name: "title", widget: "string" }
      - { label: "Marca", name: "marca", widget: "string" }
      - { label: "Imagem do Produto", name: "image", widget: "image", required: false }
      - { label: "Texto da Análise", name: "body", widget: "markdown" }

  - name: "notebooks"
    label: "Artigos: Notebooks"
    folder: "notebooks"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Título do Produto (H1)", name: "title", widget: "string" }
      - { label: "Marca", name: "marca", widget: "string" }
      - { label: "Imagem do Produto", name: "image", widget: "image", required: false }
      - { label: "Texto da Análise", name: "body", widget: "markdown" }
