backend:
  name: github
  repo: msarrafads-max/guia-rapido-tech
  branch: main

media_folder: "images"
public_folder: "/images"

collections:
  - name: "hubs"
    label: "🎨 Personalizar Páginas (Hubs)"
    files:
      - name: "smartphones_hub"
        label: "📱 Página: Smartphones"
        file: "smartphones/hub_config.json"
        fields:
          - label: "Banner de Destaque Superior"
            name: "bannerTopo"
            widget: "object"
            fields:
              - { label: "Título do Banner", name: "titulo", widget: "string", default: "Os Mais Baratinhos do Mês" }
              - { label: "Subtítulo / Descrição", name: "sub", widget: "string" }
              - { label: "Badge / Selo", name: "badge", widget: "string", default: "CUSTO-BENEFÍCIO IMPATÍVEL" }
              - { label: "Texto do Botão", name: "btnTexto", widget: "string", default: "Ver Baratinhos no Catálogo" }

          - label: "Bloco Carrossel Esquerdo"
            name: "blocoEsquerdo"
            widget: "object"
            fields:
              - { label: "Título do Bloco", name: "titulo", widget: "string", default: "Melhores Câmeras" }
              - { label: "Selo / Badge", name: "selo", widget: "string", default: "Top 5" }
              - { label: "Ícone FontAwesome", name: "icone", widget: "string", default: "fa-camera" }
              - label: "Lista de Produtos deste Bloco"
                name: "produtos"
                widget: "list"
                fields:
                  - { label: "Nome do Modelo", name: "nome", widget: "string" }
                  - { label: "Especificação / Destaque", name: "spec", widget: "string" }
                  - { label: "Preço", name: "preco", widget: "string" }
                  - { label: "URL da Análise", name: "url", widget: "string" }
                  - { label: "Imagem / Watermark", name: "img", widget: "image", required: false }

          - label: "Bloco Carrossel Direito"
            name: "blocoDireito"
            widget: "object"
            fields:
              - { label: "Título do Bloco", name: "titulo", widget: "string", default: "Mais Potentes para Jogos" }
              - { label: "Selo / Badge", name: "selo", widget: "string", default: "Top 5" }
              - { label: "Ícone FontAwesome", name: "icone", widget: "string", default: "fa-bolt" }
              - label: "Lista de Produtos deste Bloco"
                name: "produtos"
                widget: "list"
                fields:
                  - { label: "Nome do Modelo", name: "nome", widget: "string" }
                  - { label: "Especificação / Destaque", name: "spec", widget: "string" }
                  - { label: "Preço", name: "preco", widget: "string" }
                  - { label: "URL da Análise", name: "url", widget: "string" }
                  - { label: "Imagem / Watermark", name: "img", widget: "image", required: false }

      - name: "tablets_hub"
        label: "✏️ Página: Tablets"
        file: "tablets/hub_config.json"
        fields:
          - label: "Banner de Destaque Superior"
            name: "bannerTopo"
            widget: "object"
            fields:
              - { label: "Título do Banner", name: "titulo", widget: "string", default: "Melhores com Suporte a Caneta" }
              - { label: "Subtítulo / Descrição", name: "sub", widget: "string" }
              - { label: "Badge / Selo", name: "badge", widget: "string", default: "ESTUDO E CRIATIVIDADE" }
              - { label: "Texto do Botão", name: "btnTexto", widget: "string", default: "Ver Modelos no Catálogo" }

          - label: "Bloco Carrossel Esquerdo"
            name: "blocoEsquerdo"
            widget: "object"
            fields:
              - { label: "Título do Bloco", name: "titulo", widget: "string", default: "Melhores para Desenho e Notas" }
              - { label: "Selo / Badge", name: "selo", widget: "string", default: "Top 3" }
              - { label: "Ícone FontAwesome", name: "icone", widget: "string", default: "fa-pen-nib" }
              - label: "Lista de Produtos deste Bloco"
                name: "produtos"
                widget: "list"
                fields:
                  - { label: "Nome do Modelo", name: "nome", widget: "string" }
                  - { label: "Especificação / Destaque", name: "spec", widget: "string" }
                  - { label: "Preço", name: "preco", widget: "string" }
                  - { label: "URL da Análise", name: "url", widget: "string" }
                  - { label: "Imagem / Watermark", name: "img", widget: "image", required: false }

          - label: "Bloco Carrossel Direito"
            name: "blocoDireito"
            widget: "object"
            fields:
              - { label: "Título do Bloco", name: "titulo", widget: "string", default: "Custo-Benefício para Estudo" }
              - { label: "Selo / Badge", name: "selo", widget: "string", default: "Top 3" }
              - { label: "Ícone FontAwesome", name: "icone", widget: "string", default: "fa-book" }
              - label: "Lista de Produtos deste Bloco"
                name: "produtos"
                widget: "list"
                fields:
                  - { label: "Nome do Modelo", name: "nome", widget: "string" }
                  - { label: "Especificação / Destaque", name: "spec", widget: "string" }
                  - { label: "Preço", name: "preco", widget: "string" }
                  - { label: "URL da Análise", name: "url", widget: "string" }
                  - { label: "Imagem / Watermark", name: "img", widget: "image", required: false }

      - name: "notebooks_hub"
        label: "💻 Página: Notebooks"
        file: "notebooks/hub_config.json"
        fields:
          - label: "Banner de Destaque Superior"
            name: "bannerTopo"
            widget: "object"
            fields:
              - { label: "Título do Banner", name: "titulo", widget: "string", default: "Melhores para Trabalho e Estudos" }
              - { label: "Subtítulo / Descrição", name: "sub", widget: "string" }
              - { label: "Badge / Selo", name: "badge", widget: "string", default: "PRODUTIVIDADE & ESCRITÓRIO" }
              - { label: "Texto do Botão", name: "btnTexto", widget: "string", default: "Ver Modelos no Catálogo" }

          - label: "Bloco Carrossel Esquerdo"
            name: "blocoEsquerdo"
            widget: "object"
            fields:
              - { label: "Título do Bloco", name: "titulo", widget: "string", default: "Mais Rápidos para Produtividade" }
              - { label: "Selo / Badge", name: "selo", widget: "string", default: "Top 5" }
              - { label: "Ícone FontAwesome", name: "icone", widget: "string", default: "fa-laptop" }
              - label: "Lista de Produtos deste Bloco"
                name: "produtos"
                widget: "list"
                fields:
                  - { label: "Nome do Modelo", name: "nome", widget: "string" }
                  - { label: "Especificação / Destaque", name: "spec", widget: "string" }
                  - { label: "Preço", name: "preco", widget: "string" }
                  - { label: "URL da Análise", name: "url", widget: "string" }
                  - { label: "Imagem / Watermark", name: "img", widget: "image", required: false }

          - label: "Bloco Carrossel Direito"
            name: "blocoDireito"
            widget: "object"
            fields:
              - { label: "Título do Bloco", name: "titulo", widget: "string", default: "Melhores para Jogos & Criativos" }
              - { label: "Selo / Badge", name: "selo", widget: "string", default: "Top 5" }
              - { label: "Ícone FontAwesome", name: "icone", widget: "string", default: "fa-gamepad" }
              - label: "Lista de Produtos deste Bloco"
                name: "produtos"
                widget: "list"
                fields:
                  - { label: "Nome do Modelo", name: "nome", widget: "string" }
                  - { label: "Especificação / Destaque", name: "spec", widget: "string" }
                  - { label: "Preço", name: "preco", widget: "string" }
                  - { label: "URL da Análise", name: "url", widget: "string" }
                  - { label: "Imagem / Watermark", name: "img", widget: "image", required: false }

  - name: "smartphones"
    label: "📱 Artigos: Smartphones"
    folder: "smartphones"
    create: true
    slug: "{{slug}}"
    filter: { field: "title", pattern: "*" }
    fields:
      - { label: "Título do Produto (H1)", name: "title", widget: "string" }
      - { label: "Marca", name: "marca", widget: "string" }
      - { label: "Selo / Badge", name: "badge", widget: "string", default: "ANÁLISE" }
      - { label: "Imagem do Produto", name: "image", widget: "image", required: false }
      - { label: "Tela", name: "tela", widget: "string", required: false }
      - { label: "Processador", name: "processador", widget: "string", required: false }
      - { label: "Bateria", name: "bateria", widget: "string", required: false }
      - label: "Ofertas e Afiliados"
        name: "ofertas"
        widget: "object"
        fields:
          - label: "Amazon"
            name: "amazon"
            widget: "object"
            fields:
              - { label: "Preço", name: "preco", widget: "string", required: false }
              - { label: "Link de Afiliado", name: "url", widget: "string", required: false }
          - label: "Mercado Livre"
            name: "mercadoLivre"
            widget: "object"
            fields:
              - { label: "Preço", name: "preco", widget: "string", required: false }
              - { label: "Link de Afiliado", name: "url", widget: "string", required: false }
      - { label: "Texto da Análise", name: "body", widget: "markdown" }

  - name: "tablets"
    label: "✏️ Artigos: Tablets"
    folder: "tablets"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Título do Produto (H1)", name: "title", widget: "string" }
      - { label: "Marca", name: "marca", widget: "string" }
      - { label: "Imagem do Produto", name: "image", widget: "image", required: false }
      - { label: "Texto da Análise", name: "body", widget: "markdown" }

  - name: "notebooks"
    label: "💻 Artigos: Notebooks"
    folder: "notebooks"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Título do Produto (H1)", name: "title", widget: "string" }
      - { label: "Marca", name: "marca", widget: "string" }
      - { label: "Imagem do Produto", name: "image", widget: "image", required: false }
      - { label: "Texto da Análise", name: "body", widget: "markdown" }
