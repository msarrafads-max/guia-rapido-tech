backend:
  name: github
  repo: msarrafads-max/guia-rapido-tech
  branch: main
  base_url: https://decap-oauth.msarraf-ads.workers.dev
  auth_endpoint: /auth

site_url: https://guiarapidotech.com.br
display_url: https://guiarapidotech.com.br
logo_url: /assets/images/logo.svg
media_folder: "src/assets/images/uploads"
public_folder: "/assets/images/uploads"
publish_mode: editorial_workflow
collections:
  - name: "configuracao"
    label: "Configurações do site"
    files:
      - name: "site"
        label: "Identidade visual e configurações globais"
        file: "src/_data/site.json"
        format: "json"
        fields:
          - { label: "Nome do site", name: "site_name", widget: "string", default: "Guia Rápido Tech" }
          - { label: "Descrição padrão", name: "description", widget: "text" }
          - { label: "Logotipo para modo claro", name: "logo", widget: "image", required: false }
          - { label: "Logotipo para modo escuro (opcional)", name: "logo_dark", widget: "image", required: false, hint: "Envie uma versão adequada ao fundo escuro. Se ficar vazio, será usado o logotipo do modo claro." }         
          - { label: "Favicon / ícone do site", name: "favicon", widget: "image", required: false, hint: "Ícone quadrado do site. O Google decide quando exibi-lo nos resultados." }
          - { label: "Cor principal", name: "primary_color", widget: "color", default: "#2563eb" }
          - { label: "Cor de destaque", name: "accent_color", widget: "color", default: "#12b981" }
          - { label: "Cor de fundo claro", name: "light_background", widget: "color", default: "#f5f7fb" }
          - { label: "Cor de texto claro", name: "light_text", widget: "color", default: "#172033" }
          - { label: "Cor de fundo escuro", name: "dark_background", widget: "color", default: "#0b1020" }
          - { label: "Cor de texto escuro", name: "dark_text", widget: "color", default: "#edf2ff" }
          - { label: "Título SEO padrão", name: "seo_title", widget: "string" }
          - { label: "Descrição SEO padrão", name: "seo_description", widget: "text" }
          - { label: "Texto do rodapé", name: "footer_text", widget: "string" }
      - name: "pages"
        label: "Páginas institucionais"
        file: "src/_data/pages.json"
        format: "json"
        fields:
          - label: "Quem somos"
            name: "about"
            widget: "object"
            fields:
              - { label: "Texto pequeno superior", name: "eyebrow", widget: "string" }
              - { label: "Título principal", name: "heading", widget: "string" }
              - { label: "Texto de introdução", name: "lead", widget: "text" }
              - label: "Seções da página"
                name: "sections"
                widget: "list"
                summary: "{{fields.heading}}"
                fields:
                  - { label: "Título da seção", name: "heading", widget: "string", required: false }
                  - label: "Parágrafos"
                    name: "paragraphs"
                    widget: "list"
                    field: { label: "Texto do parágrafo", name: "paragraph", widget: "text" }
          - label: "Política de Privacidade"
            name: "privacy"
            widget: "object"
            fields:
              - { label: "Texto pequeno superior", name: "eyebrow", widget: "string" }
              - { label: "Título principal", name: "heading", widget: "string" }
              - { label: "Data da última atualização", name: "last_updated", widget: "string", required: false }
              - label: "Seções da política"
                name: "sections"
                widget: "list"
                summary: "{{fields.heading}}"
                fields:
                  - { label: "Título da seção", name: "heading", widget: "string", required: false }
                  - label: "Parágrafos"
                    name: "paragraphs"
                    widget: "list"
                    field: { label: "Texto do parágrafo", name: "paragraph", widget: "text" }
              - { label: "Nota final (opcional)", name: "note", widget: "text", required: false }
      - name: "home"
        label: "Página inicial"
        file: "src/_data/home.json"
        format: "json"
        fields:
          - { label: "Título principal", name: "hero_title", widget: "string" }
          - { label: "Subtítulo principal", name: "hero_description", widget: "text" }
          - { label: "Texto do botão", name: "hero_button_text", widget: "string" }
          - { label: "Slug do artigo do botão", name: "hero_article_slug", widget: "string", required: false }
          - { label: "Título da seção de lançamentos", name: "latest_title", widget: "string" }
          - { label: "Descrição da seção", name: "latest_description", widget: "string", required: false }
          - label: "Cards em destaque"
            name: "featured_cards"
            widget: "list"
            summary: "{{fields.title}}"
            fields:
              - { label: "Título", name: "title", widget: "string" }
              - { label: "Descrição", name: "description", widget: "text", required: false }
              - { label: "Imagem", name: "image", widget: "image", required: false }
              - { label: "Texto do botão", name: "button_text", widget: "string", default: "Ver análise" }
              - { label: "Categoria do destino", name: "article_category", widget: "select", options: [{label: "Smartphones", value: "smartphones"}, {label: "Tablets", value: "tablets"}, {label: "Notebooks", value: "notebooks"}], default: "smartphones" }
              - { label: "Slug do artigo de destino", name: "article_slug", widget: "string", required: false }
          - { label: "Exibir últimos reviews", name: "show_latest_reviews", widget: "boolean", default: true }
          - { label: "Quantidade de últimos reviews", name: "latest_count", widget: "number", default: 6, value_type: "int", min: 1, max: 12 }
      - name: "smartphones"
        label: "Vitrine e marcas — Smartphones"
        file: "src/_data/categories/smartphones.json"
        format: "json"
        fields: &category_fields
          - { label: "Título da página", name: "title", widget: "string" }
          - { label: "Subtítulo", name: "description", widget: "text" }
          - { label: "Título SEO", name: "seo_title", widget: "string", required: false }
          - { label: "Descrição SEO", name: "seo_description", widget: "text", required: false }
          - label: "Marcas principais (até 4)"
            name: "brands"
            widget: "list"
            max: 4
            field: { label: "Marca", name: "brand", widget: "string" }
          - label: "Card principal"
            name: "main_card"
            widget: "object"
            fields:
              - { label: "Título", name: "title", widget: "string" }
              - { label: "Descrição", name: "description", widget: "text", required: false }
              - { label: "Selo", name: "badge", widget: "string", required: false }
              - { label: "Slugs dos artigos dos slides (um por item)", name: "article_slugs", widget: "list", field: { label: "Slug do artigo", name: "slug", widget: "string" } }
              - { label: "Slug do guia completo (opcional)", name: "guide_slug", widget: "string", required: false, hint: "Digite apenas o slug do artigo, sem URL. Ex.: 5-smartphones-mais-baratos-dezembro." }
              - { label: "Tipo de guia", name: "guide_type", widget: "select", options: [{label: "Lista / ranking", value: "listas"}, {label: "Comparativo editorial", value: "comparativos"}], required: false }
          - label: "Card inferior esquerdo"
            name: "left_card"
            widget: "object"
            fields:
              - { label: "Título", name: "title", widget: "string" }
              - { label: "Descrição", name: "description", widget: "text", required: false }
              - { label: "Selo", name: "badge", widget: "string", required: false }
              - { label: "Slugs dos artigos dos slides", name: "article_slugs", widget: "list", field: { label: "Slug do artigo", name: "slug", widget: "string" } }
              - { label: "Slug do guia completo (opcional)", name: "guide_slug", widget: "string", required: false, hint: "Digite apenas o slug do artigo, sem URL. Ex.: melhores-moto-g." }
              - { label: "Tipo de guia", name: "guide_type", widget: "select", options: [{label: "Lista / ranking", value: "listas"}, {label: "Comparativo editorial", value: "comparativos"}], required: false }
          - label: "Card inferior direito"
            name: "right_card"
            widget: "object"
            fields:
              - { label: "Título", name: "title", widget: "string" }
              - { label: "Descrição", name: "description", widget: "text", required: false }
              - { label: "Selo", name: "badge", widget: "string", required: false }
              - { label: "Slugs dos artigos dos slides", name: "article_slugs", widget: "list", field: { label: "Slug do artigo", name: "slug", widget: "string" } }
              - { label: "Slug do guia completo (opcional)", name: "guide_slug", widget: "string", required: false, hint: "Digite apenas o slug do artigo, sem URL. Ex.: melhores-moto-g." }
              - { label: "Tipo de guia", name: "guide_type", widget: "select", options: [{label: "Lista / ranking", value: "listas"}, {label: "Comparativo editorial", value: "comparativos"}], required: false }
      - name: "tablets"
        label: "Vitrine e marcas — Tablets"
        file: "src/_data/categories/tablets.json"
        format: "json"
        fields: *category_fields
      - name: "notebooks"
        label: "Vitrine e marcas — Notebooks"
        file: "src/_data/categories/notebooks.json"
        format: "json"
        fields: *category_fields
  - name: "smartphones"
    label: "Reviews de smartphones"
    folder: "src/content/articles/smartphones"
    create: true
    extension: "md"
    format: "frontmatter"
    slug: "{{slug}}"
    summary: "{{title}} — {{brand}} {{model}}"
    fields: &article_fields
      - { label: "Título da página (H1)", name: "title", widget: "string" }
      - { label: "Slug da URL (sem espaços)", name: "slug", widget: "string" }
      - { label: "Status", name: "status", widget: "select", options: ["published", "draft"], default: "published" }
      - { label: "Data e hora da publicação", name: "date", widget: "datetime", required: false, date_format: "DD/MM/YYYY", time_format: "HH:mm", format: "YYYY-MM-DDTHH:mm:ssZ" }
      - { label: "Marca", name: "brand", widget: "string" }
      - { label: "Modelo", name: "model", widget: "string" }
      - { label: "Título SEO", name: "seo_title", widget: "string" }
      - { label: "Descrição SEO", name: "seo_description", widget: "text" }
      - { label: "Palavras-chave", name: "keywords", widget: "string", required: false }
      - { label: "Imagem do produto", name: "image", widget: "image", required: false }
      - { label: "Texto alternativo da imagem", name: "image_alt", widget: "string", required: false }
      - { label: "Imagem do produto na tabela comparativa (opcional)", name: "comparison_image", widget: "image", required: false, hint: "Se deixar vazio, a tabela usa a imagem principal do produto." }
      - { label: "Texto alternativo da imagem da tabela", name: "comparison_image_alt", widget: "string", required: false }
      - label: "Galeria de fotos do produto"
        name: "gallery"
        widget: "list"
        required: false
        summary: "{{fields.caption}}"
        fields:
          - { label: "Foto", name: "image", widget: "image" }
          - { label: "Texto alternativo", name: "alt", widget: "string", required: false }
          - { label: "Legenda (opcional)", name: "caption", widget: "string", required: false }
      - { label: "Selo do produto", name: "badge", widget: "string", default: "ANÁLISE" }
      - { label: "Preço estimado", name: "estimated_price", widget: "string", required: false }
      - label: "Destaques técnicos"
        name: "specs"
        widget: "object"
        fields:
          - { label: "Tela / display", name: "screen", widget: "string", required: false }
          - { label: "Processador", name: "processor", widget: "string", required: false }
          - { label: "Memória / armazenamento", name: "memory", widget: "string", required: false }
          - { label: "Bateria / autonomia", name: "battery", widget: "string", required: false }
          - { label: "Câmeras / gráficos", name: "camera_graphics", widget: "string", required: false }
          - { label: "Sistema operacional", name: "os", widget: "string", required: false }
      - label: "Ficha técnica ampliada"
        name: "technical_sheet"
        widget: "object"
        required: false
        collapsed: true
        fields:
          - { label: "Texto superior da seção", name: "eyebrow", widget: "string", required: false, default: "ESPECIFICAÇÕES" }
          - { label: "Título da seção", name: "title", widget: "string", required: false, default: "Ficha técnica e hardware" }
          - { label: "Texto introdutório", name: "intro", widget: "text", required: false }
          - label: "Cartões de especificações"
            name: "groups"
            widget: "list"
            required: false
            summary: "{{fields.title}}"
            fields:
              - { label: "Título do cartão", name: "title", widget: "string" }
              - { label: "Ícone ou símbolo (opcional)", name: "icon", widget: "string", required: false, hint: "Ex.: ◉, ⚡, ▣. Deixe vazio para não mostrar ícone." }
              - { label: "O cartão ocupa a largura toda?", name: "wide", widget: "boolean", default: false, required: false }
              - label: "Características"
                name: "items"
                widget: "list"
                required: false
                summary: "{{fields.label}}: {{fields.value}}"
                fields:
                  - { label: "Nome da característica", name: "label", widget: "string" }
                  - { label: "Valor / descrição", name: "value", widget: "string" }
          - { label: "Título da área de câmeras", name: "cameras_title", widget: "string", required: false, default: "Câmeras" }
          - { label: "Subtítulo das câmeras (opcional)", name: "cameras_subtitle", widget: "string", required: false }
          - label: "Sensores / câmeras (opcional)"
            name: "cameras"
            widget: "list"
            required: false
            summary: "{{fields.type}} — {{fields.megapixels}}"
            fields:
              - { label: "Tipo de câmera", name: "type", widget: "string", required: false, hint: "Ex.: Principal, Ultrawide, Telefoto, Frontal" }
              - { label: "Resolução (opcional)", name: "megapixels", widget: "string", required: false, hint: "Ex.: 50 MP" }
              - { label: "Detalhes técnicos", name: "details", widget: "string", required: false, hint: "Ex.: f/1.8 · OIS · zoom óptico 3x" }
              - { label: "Estabilização / observação (opcional)", name: "stabilization", widget: "string", required: false, hint: "Ex.: Com OIS" }
          - { label: "Gravação de vídeo (opcional)", name: "video_recording", widget: "string", required: false }
      - label: "Checklist de recursos"
        name: "feature_checklist"
        widget: "object"
        required: false
        collapsed: true
        fields:
          - { label: "Texto superior da seção", name: "eyebrow", widget: "string", required: false, default: "RECURSOS E EXTRAS" }
          - { label: "Título da seção", name: "title", widget: "string", required: false, default: "O que o aparelho oferece" }
          - { label: "Texto introdutório (opcional)", name: "intro", widget: "text", required: false }
          - label: "Itens do checklist"
            name: "items"
            widget: "list"
            required: false
            summary: "{{fields.label}}"
            fields:
              - { label: "Recurso / característica", name: "label", widget: "string" }
              - label: "Situação"
                name: "status"
                widget: "select"
                options:
                  - { label: "Sim", value: "yes" }
                  - { label: "Não", value: "no" }
                  - { label: "Texto personalizado", value: "custom" }
                default: "yes"
              - { label: "Texto personalizado (para situação personalizada)", name: "custom_text", widget: "string", required: false, hint: "Ex.: IP68, carregador de 25 W incluso ou depende da versão." }
      - { label: "Nossa análise breve (seção ‘O que achamos’)", name: "analysis_opinion", widget: "text", required: false }
      - label: "Pontos positivos"
        name: "pros"
        widget: "list"
        required: false
        field: { label: "Ponto positivo", name: "item", widget: "string" }
      - label: "Pontos negativos"
        name: "cons"
        widget: "list"
        required: false
        field: { label: "Ponto negativo", name: "item", widget: "string" }
      - label: "Ofertas das lojas"
        name: "offers"
        widget: "object"
        fields:
          - label: "Amazon"
            name: "amazon"
            widget: "object"
            fields: &offer_fields
              - { label: "Ícone/logo da loja (opcional)", name: "store_icon", widget: "image", required: false }
              - { label: "Disponibilidade", name: "availability", widget: "select", options: [{label: "Disponível", value: "available"}, {label: "Produto indisponível", value: "unavailable"}, {label: "Não verificado", value: "unknown"}], default: "unknown" }
              - { label: "Preço", name: "price", widget: "string", required: false }
              - { label: "Texto auxiliar", name: "detail", widget: "string", required: false }
              - { label: "Link de afiliado", name: "url", widget: "string", required: false }
              - label: "Situação da avaliação"
                name: "rating_status"
                widget: "select"
                options:
                  - { label: "Informar nota em estrelas", value: "rated" }
                  - { label: "Pré-venda / ainda sem avaliações", value: "prelaunch" }
                  - { label: "Ainda sem avaliações", value: "no_reviews" }
                  - { label: "Avaliação não disponível", value: "unavailable" }
                default: "unavailable"
              - { label: "Nota da loja (0 a 5; aceita meios pontos)", name: "rating", widget: "number", value_type: "float", min: 0, max: 5, step: 0.5, required: false }
          - label: "Mercado Livre"
            name: "mercadolivre"
            widget: "object"
            fields: *offer_fields
          - label: "Shopee"
            name: "shopee"
            widget: "object"
            fields: *offer_fields
      - label: "Comparação com dois concorrentes"
        name: "comparisons"
        widget: "list"
        min: 2
        max: 2
        fields:
          - { label: "Nome do concorrente", name: "name", widget: "string" }
          - { label: "Foto do concorrente", name: "image", widget: "image", required: false }
          - { label: "Texto alternativo da foto", name: "image_alt", widget: "string", required: false }
          - { label: "Slug do review concorrente", name: "article_slug", widget: "string", required: false }
          - { label: "Link externo alternativo", name: "external_url", widget: "string", required: false }
          - { label: "Destaque", name: "highlight", widget: "string", required: false }
          - { label: "Tela / display", name: "screen", widget: "string", required: false }
          - { label: "Processador", name: "processor", widget: "string", required: false }
          - { label: "Memória / armazenamento", name: "memory", widget: "string", required: false }
          - { label: "Bateria / autonomia", name: "battery", widget: "string", required: false }
          - { label: "Câmeras / gráficos", name: "camera_graphics", widget: "string", required: false }
          - { label: "Preço estimado", name: "price", widget: "string", required: false }
      - { label: "Vídeo do YouTube (opcional)", name: "youtube_url", widget: "string", required: false }
      - { label: "Análise completa", name: "body", widget: "markdown" }
  - name: "tablets"
    label: "Reviews de tablets"
    folder: "src/content/articles/tablets"
    create: true
    extension: "md"
    format: "frontmatter"
    slug: "{{slug}}"
    summary: "{{title}} — {{brand}} {{model}}"
    fields: *article_fields
  - name: "notebooks"
    label: "Reviews de notebooks"
    folder: "src/content/articles/notebooks"
    create: true
    extension: "md"
    format: "frontmatter"
    slug: "{{slug}}"
    summary: "{{title}} — {{brand}} {{model}}"
    fields: *article_fields
  - name: "guias-listas"
    label: "Guias de listas (Top 5, Top 10...)"
    folder: "src/content/guides/listas"
    create: true
    extension: "md"
    format: "frontmatter"
    slug: "{{slug}}"
    summary: "{{title}}"
    fields: &guide_list_fields
      - { label: "Título do guia", name: "title", widget: "string" }
      - { label: "Slug da URL (sem espaços)", name: "slug", widget: "string" }
      - { label: "Status", name: "status", widget: "select", options: ["published", "draft"], default: "published" }
      - { label: "Data de publicação", name: "date", widget: "datetime", required: false, date_format: "DD/MM/YYYY", time_format: "HH:mm", format: "YYYY-MM-DDTHH:mm:ssZ" }
      - { label: "Categoria", name: "category", widget: "select", options: [{label: "Smartphones", value: "smartphones"}, {label: "Tablets", value: "tablets"}, {label: "Notebooks", value: "notebooks"}], default: "smartphones" }
      - { label: "Descrição curta / SEO", name: "description", widget: "text" }
      - { label: "Título SEO (opcional)", name: "seo_title", widget: "string", required: false }
      - { label: "Descrição SEO (opcional)", name: "seo_description", widget: "text", required: false }
      - { label: "Imagem de capa", name: "cover_image", widget: "image", required: false }
      - { label: "Texto alternativo da capa", name: "cover_alt", widget: "string", required: false }
      - { label: "Legenda da capa", name: "cover_caption", widget: "string", required: false }
      - { label: "Introdução", name: "intro", widget: "markdown", required: false }
      - label: "Produtos da lista (até 20; use 5, 10 ou quantos precisar)"
        name: "products"
        widget: "list"
        min: 1
        max: 20
        summary: "{{fields.name}}"
        fields:
          - { label: "Posição / selo", name: "rank", widget: "string", required: false }
          - { label: "Nome do produto", name: "name", widget: "string" }
          - { label: "Imagem do produto", name: "image", widget: "image", required: false }
          - { label: "Texto alternativo da imagem", name: "image_alt", widget: "string", required: false }
          - { label: "Breve descrição", name: "short_description", widget: "text", required: false }
          - { label: "Subtítulo / critério (ex.: Preço)", name: "highlight_label", widget: "string", required: false }
          - { label: "Valor do destaque (ex.: R$ 799)", name: "highlight_value", widget: "string", required: false }
          - { label: "Segundo subtítulo menor", name: "secondary_label", widget: "string", required: false }
          - { label: "Valor do segundo subtítulo", name: "secondary_value", widget: "string", required: false }
          - { label: "Breve análise", name: "analysis", widget: "text", required: false }
          - { label: "Slug do review completo", name: "review_slug", widget: "string", required: false }
          - { label: "Categoria do review", name: "review_category", widget: "select", options: [{label: "Smartphones", value: "smartphones"}, {label: "Tablets", value: "tablets"}, {label: "Notebooks", value: "notebooks"}], default: "smartphones" }
          - { label: "URL alternativa do review", name: "review_url", widget: "string", required: false }
          - { label: "Texto do botão", name: "button_text", widget: "string", default: "Ver análise completa" }
      - { label: "Texto complementar ao final", name: "body", widget: "markdown", required: false }
  - name: "guias-comparativos"
    label: "Comparativos editoriais livres"
    folder: "src/content/guides/comparativos"
    create: true
    extension: "md"
    format: "frontmatter"
    slug: "{{slug}}"
    summary: "{{title}}"
    fields:
      - { label: "Título do artigo", name: "title", widget: "string" }
      - { label: "Slug da URL (sem espaços)", name: "slug", widget: "string" }
      - { label: "Status", name: "status", widget: "select", options: ["published", "draft"], default: "published" }
      - { label: "Data de publicação", name: "date", widget: "datetime", required: false, date_format: "DD/MM/YYYY", time_format: "HH:mm", format: "YYYY-MM-DDTHH:mm:ssZ" }
      - { label: "Descrição curta / SEO", name: "description", widget: "text" }
      - { label: "Selo superior", name: "editorial_label", widget: "string", required: false, default: "GUIA DE COMPRA • COMPARATIVO" }
      - { label: "Autor (opcional)", name: "author", widget: "string", required: false }
      - { label: "Tempo de leitura (ex.: 4 min)", name: "reading_time", widget: "string", required: false }
      - { label: "Imagem de capa (opcional)", name: "cover_image", widget: "image", required: false }
      - { label: "Texto alternativo da capa", name: "cover_alt", widget: "string", required: false }
      - { label: "Legenda da capa", name: "cover_caption", widget: "string", required: false }
      - { label: "Resposta rápida em destaque", name: "quick_answer", widget: "markdown", required: false, hint: "Resumo objetivo destacado em uma caixa azul antes dos produtos." }
      - { label: "Título SEO (opcional)", name: "seo_title", widget: "string", required: false }
      - { label: "Descrição SEO (opcional)", name: "seo_description", widget: "text", required: false }
      - { label: "Introdução", name: "intro", widget: "markdown", required: false }
      - label: "Produtos comparados"
        name: "products"
        widget: "list"
        min: 1
        max: 20
        summary: "{{fields.name}}"
        fields:
          - { label: "Posição / selo", name: "rank", widget: "string", required: false }
          - { label: "Subtítulo / nome do produto", name: "name", widget: "string" }
          - { label: "Imagem do produto", name: "image", widget: "image", required: false }
          - { label: "Texto alternativo", name: "image_alt", widget: "string", required: false }
          - { label: "Breve descrição", name: "description", widget: "text", required: false }
          - { label: "Destaque curto (opcional)", name: "highlight_label", widget: "string", required: false, hint: "Ex.: MELHOR PARA ESTUDOS" }
          - { label: "Texto do destaque (opcional)", name: "highlight_value", widget: "string", required: false, hint: "Ex.: Melhor para PDFs e multitarefa" }
          - { label: "Este produto é um bônus?", name: "is_bonus", widget: "boolean", default: false, required: false }
          - { label: "Categoria do review", name: "category", widget: "select", options: [{label: "Smartphones", value: "smartphones"}, {label: "Tablets", value: "tablets"}, {label: "Notebooks", value: "notebooks"}], default: "smartphones" }
          - { label: "Slug do review completo", name: "review_slug", widget: "string", required: false }
          - { label: "URL alternativa do review", name: "review_url", widget: "string", required: false }
          - { label: "Texto do botão", name: "button_text", widget: "string", default: "Ver análise completa" }
          - label: "Pontos fortes (máximo 3)"
            name: "strengths"
            widget: "list"
            max: 3
            required: false
            field: { label: "Ponto forte", name: "strength", widget: "string" }
      - { label: "Título da seção editorial", name: "body_heading", widget: "string", required: false, default: "O que você precisa saber antes de escolher" }
      - { label: "Conteúdo adicional do artigo", name: "body", widget: "markdown", required: false, hint: "Este conteúdo aparece abaixo dos cards e do comparativo. Use títulos, listas e negrito." }
      - { label: "Título da tabela comparativa", name: "comparison_table_title", widget: "string", required: false, default: "Comparativo rápido lado a lado" }
      - { label: "Introdução da tabela (opcional)", name: "comparison_table_intro", widget: "text", required: false }
      - label: "Linhas da tabela comparativa (opcional)"
        name: "comparison_rows"
        widget: "list"
        required: false
        max: 30
        summary: "{{fields.feature}}"
        fields:
          - { label: "Característica", name: "feature", widget: "string" }
          - label: "Valores por produto (na mesma ordem dos cards)"
            name: "values"
            widget: "list"
            min: 1
            max: 20
            field: { label: "Valor", name: "value", widget: "string" }
      - { label: "Título do veredito final", name: "verdict_title", widget: "string", required: false, default: "Veredito: qual escolher?" }
      - { label: "Veredito final por perfil de usuário", name: "verdict", widget: "markdown", required: false }
  - name: "editoriais-livres"
    label: "Artigos editoriais livres"
    folder: "src/content/guides/editoriais-livres"
    create: true
    extension: "md"
    format: "frontmatter"
    slug: "{{slug}}"
    summary: "{{title}}"
    fields:
      - { label: "Título do artigo", name: "title", widget: "string" }
      - { label: "Slug da URL (sem espaços)", name: "slug", widget: "string" }
      - { label: "Status", name: "status", widget: "select", options: ["published", "draft"], default: "published" }
      - { label: "Data de publicação", name: "date", widget: "datetime", required: false, date_format: "DD/MM/YYYY", time_format: "HH:mm", format: "YYYY-MM-DDTHH:mm:ssZ" }
      - { label: "Resumo / descrição", name: "description", widget: "text" }
      - { label: "Selo superior (opcional)", name: "editorial_label", widget: "string", required: false, default: "GUIA RÁPIDO TECH" }
      - { label: "Autor (opcional)", name: "author", widget: "string", required: false }
      - { label: "Tempo de leitura (opcional)", name: "reading_time", widget: "string", required: false }
      - { label: "Imagem de capa", name: "cover_image", widget: "image", required: false }
      - { label: "Texto alternativo da capa", name: "cover_alt", widget: "string", required: false }
      - { label: "Legenda da capa", name: "cover_caption", widget: "string", required: false }
      - { label: "Título SEO (opcional)", name: "seo_title", widget: "string", required: false }
      - { label: "Descrição SEO (opcional)", name: "seo_description", widget: "text", required: false }
      - { label: "Palavras-chave SEO (opcional)", name: "keywords", widget: "string", required: false }
      - { label: "Introdução (opcional)", name: "intro", widget: "markdown", required: false }
      - label: "Blocos do artigo — adicione e reorganize como quiser"
        name: "blocks"
        widget: "list"
        required: false
        types:
          - label: "Parágrafo"
            name: "paragraph"
            widget: "object"
            fields:
              - { label: "Texto", name: "text", widget: "markdown" }
          - label: "Título H2"
            name: "heading2"
            widget: "object"
            fields:
              - { label: "Título", name: "text", widget: "string" }
              - { label: "ID da seção (opcional)", name: "anchor", widget: "string", required: false }
          - label: "Título H3"
            name: "heading3"
            widget: "object"
            fields:
              - { label: "Título", name: "text", widget: "string" }
          - label: "Imagem"
            name: "image"
            widget: "object"
            fields:
              - { label: "Imagem", name: "image", widget: "image" }
              - { label: "Texto alternativo", name: "alt", widget: "string" }
              - { label: "Legenda (opcional)", name: "caption", widget: "string", required: false }
              - { label: "Largura", name: "width", widget: "select", options: [{label: "Normal", value: "normal"}, {label: "Larga", value: "wide"}, {label: "Compacta", value: "compact"}, {label: "Tela inteira", value: "full"}], default: "wide" }
          - label: "Citação"
            name: "quote"
            widget: "object"
            fields:
              - { label: "Texto da citação", name: "text", widget: "text" }
              - { label: "Fonte / autor (opcional)", name: "source", widget: "string", required: false }
          - label: "Caixa de destaque"
            name: "callout"
            widget: "object"
            fields:
              - { label: "Título (opcional)", name: "title", widget: "string", required: false }
              - { label: "Texto", name: "text", widget: "markdown" }
              - { label: "Estilo", name: "style", widget: "select", options: [{label: "Azul", value: "blue"}, {label: "Verde", value: "green"}, {label: "Amarelo", value: "yellow"}, {label: "Neutro", value: "neutral"}], default: "blue" }
          - label: "Lista"
            name: "list"
            widget: "object"
            fields:
              - { label: "Título (opcional)", name: "title", widget: "string", required: false }
              - { label: "Itens (um por linha)", name: "items", widget: "text" }
              - { label: "Lista numerada?", name: "ordered", widget: "boolean", default: false }
          - label: "Tabela"
            name: "table"
            widget: "object"
            fields:
              - { label: "Título (opcional)", name: "title", widget: "string", required: false }
              - { label: "Cabeçalhos (separados por |)", name: "headers", widget: "string", hint: "Ex.: Modelo | Tela | Bateria" }
              - { label: "Linhas (uma por linha; colunas separadas por |)", name: "rows", widget: "text", hint: "Ex.: Modelo A | 6,5 pol. | 5000 mAh" }
          - label: "Pontos positivos e negativos"
            name: "proscons"
            widget: "object"
            fields:
              - { label: "Título (opcional)", name: "title", widget: "string", required: false }
              - { label: "Pontos positivos (um por linha)", name: "pros", widget: "text" }
              - { label: "Pontos negativos (um por linha)", name: "cons", widget: "text" }
          - label: "Botão / chamada para ação"
            name: "button"
            widget: "object"
            fields:
              - { label: "Texto do botão", name: "text", widget: "string", default: "VER ANÁLISE COMPLETA" }
              - { label: "Destino (URL completa ou caminho)", name: "url", widget: "string", hint: "Ex.: /smartphones/motorola-signature-27.html" }
              - { label: "Cor de fundo (hex)", name: "background", widget: "string", default: "#2563eb" }
              - { label: "Cor do texto (hex)", name: "color", widget: "string", default: "#ffffff" }
              - { label: "Tamanho", name: "size", widget: "select", options: [{label: "Compacto", value: "small"}, {label: "Normal", value: "normal"}, {label: "Grande", value: "large"}], default: "normal" }
              - { label: "Formato", name: "style", widget: "select", options: [{label: "Preenchido", value: "solid"}, {label: "Contorno", value: "outline"}], default: "solid" }
              - { label: "Alinhamento", name: "align", widget: "select", options: [{label: "Esquerda", value: "left"}, {label: "Centro", value: "center"}, {label: "Direita", value: "right"}], default: "left" }
              - { label: "Espaço acima", name: "space_top", widget: "select", options: [{label: "Pequeno", value: "small"}, {label: "Normal", value: "normal"}, {label: "Grande", value: "large"}], default: "normal" }
              - { label: "Espaço abaixo", name: "space_bottom", widget: "select", options: [{label: "Pequeno", value: "small"}, {label: "Normal", value: "normal"}, {label: "Grande", value: "large"}], default: "normal" }
      - { label: "Conclusão (opcional)", name: "conclusion", widget: "markdown", required: false }
