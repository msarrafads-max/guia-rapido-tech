<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smartphones | Guia Rápido Tech</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darker: '#090d16',
                        carddark: '#111827'
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-darker text-slate-100 min-h-screen flex flex-col justify-between selection:bg-indigo-500 selection:text-white">

    <!-- HEADER / MENU -->
    <header class="border-b border-slate-800 bg-darker/80 backdrop-blur-md sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
            <a href="/" class="text-xl font-extrabold tracking-tight text-white flex items-center gap-2">
                <i class="fa-solid fa-bolt text-indigo-500"></i> Guia Rápido <span class="text-indigo-400">Tech</span>
            </a>
            <nav class="hidden md:flex items-center gap-6 text-sm font-medium text-slate-300">
                <a href="/" class="hover:text-white transition">Home</a>
                <a href="/smartphones/" class="text-indigo-400 font-semibold transition">Smartphones</a>
                <a href="/tablets/" class="hover:text-white transition">Tablets</a>
                <a href="/notebooks/" class="hover:text-white transition">Notebooks</a>
            </nav>
            <a href="/admin/#/" target="_blank" class="text-xs px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-lg border border-slate-700 transition flex items-center gap-1.5">
                <i class="fa-solid fa-lock text-[10px]"></i> Admin
            </a>
        </div>
    </header>

    <!-- CONTEÚDO PRINCIPAL -->
    <main class="flex-grow max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10 w-full">
        
        <!-- CABEÇALHO DO HUB (Dinâmico via hub_config.json) -->
        <div class="mb-12 border-b border-slate-800/80 pb-8">
            <div id="hub-badge" class="inline-block text-xs font-bold px-3 py-1 bg-indigo-500/10 text-indigo-400 rounded-full border border-indigo-500/20 mb-3 tracking-wider uppercase">
                Carregando...
            </div>
            <h1 id="hub-titulo" class="text-3xl sm:text-4xl font-extrabold text-white tracking-tight mb-3">
                Smartphones
            </h1>
            <p id="hub-subtitulo" class="text-slate-400 text-base sm:text-lg max-w-2xl">
                Carregando descrição da categoria...
            </p>
        </div>

        <!-- GRID DE ARTIGOS -->
        <div class="mb-6 flex items-center justify-between">
            <h2 class="text-xl font-bold text-white flex items-center gap-2">
                <i class="fa-solid fa-mobile-screen text-indigo-500"></i> Análises Recentes
            </h2>
            <span class="text-xs text-slate-400" id="contador-artigos">Buscando artigos...</span>
        </div>

        <!-- Onde os cards dos smartphones vão aparecer dinamicamente -->
        <div id="grid-artigos" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- Skeleton de Carregamento -->
            <div class="bg-carddark border border-slate-800 rounded-2xl p-4 animate-pulse">
                <div class="w-full h-48 bg-slate-800 rounded-xl mb-4"></div>
                <div class="h-4 bg-slate-800 rounded w-1/3 mb-2"></div>
                <div class="h-6 bg-slate-800 rounded w-3/4 mb-4"></div>
                <div class="h-10 bg-slate-800 rounded w-full"></div>
            </div>
        </div>

    </main>

    <!-- FOOTER -->
    <footer class="border-t border-slate-800/80 bg-slate-950 py-8 mt-20 text-sm text-slate-500">
        <div class="max-w-7xl mx-auto px-4 flex flex-col sm:flex-row items-center justify-between gap-4 text-center sm:text-left">
            <p>&copy; 2026 Guia Rápido Tech. Todos os direitos reservados.</p>
            <div class="flex items-center gap-6">
                <a href="/privacidade.html" class="hover:text-slate-300 transition">Política de Privacidade</a>
            </div>
        </div>
    </footer>

    <!-- SCRIPT DE CARREGAMENTO DINÂMICO -->
    <script>
        async function carregarHubSmartphones() {
            try {
                // 1. Carrega as configurações do Hub
                const resConfig = await fetch('hub_config.json');
                if (resConfig.ok) {
                    const config = await resConfig.json();
                    if(config.badge) document.getElementById('hub-badge').innerText = config.badge;
                    if(config.titulo) document.getElementById('hub-titulo').innerText = config.titulo;
                    if(config.subtitulo) document.getElementById('hub-subtitulo').innerText = config.subtitulo;
                }
            } catch (e) {
                console.log("Usando padrões para o hub.");
            }

            // 2. Simula a listagem de artigos criados na pasta
            // Nota: Em hospedagens estáticas puras, varremos via API do GitHub ou Gitment. 
            // Para simplificar e garantir funcionamento imediato no Pages sem build complexo, 
            // estruturaremos um leitor de índice ou lista estática gerenciada.
            const grid = document.getElementById('grid-artigos');
            grid.innerHTML = `
                <div class="col-span-full py-12 text-center bg-slate-900/40 border border-slate-800/80 rounded-2xl">
                    <i class="fa-regular fa-folder-open text-4xl text-slate-600 mb-3"></i>
                    <p class="text-slate-300 font-medium">Nenhum artigo publicado ainda.</p>
                    <p class="text-xs text-slate-500 mt-1">Acesse o painel do Decap CMS para publicar sua primeira análise de smartphone.</p>
                </div>
            `;
            document.getElementById('contador-artigos').innerText = "0 artigos encontrados";
        }

        carregarHubSmartphones();
    </script>
</body>
</html>
